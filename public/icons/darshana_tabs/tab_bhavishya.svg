<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sunGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0" />
    </radialGradient>
    <filter id="sunFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Radiant Aura -->
  <circle cx="32" cy="32" r="30" fill="url(#sunGlow)" opacity="0.5" />
  
  <!-- Outer Zodiac Rim with Astrological Nodes -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#sunGold)" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#sunGold)" stroke-width="1" />

  <!-- 12 Astrological Sun Rays / Bhavas -->
  <!-- 0 deg -->
  <path d="M32 4 L34 11 L30 11 Z" fill="url(#sunGold)" />
  <!-- 90 deg -->
  <path d="M60 32 L53 34 L53 30 Z" fill="url(#sunGold)" />
  <!-- 180 deg -->
  <path d="M32 60 L30 53 L34 53 Z" fill="url(#sunGold)" />
  <!-- 270 deg -->
  <path d="M4 32 L11 30 L11 34 Z" fill="url(#sunGold)" />
  
  <!-- Diagonal Rays (45, 135, 225, 315) -->
  <path d="M51.8 12.2 L45.5 16.5 L47.5 12.5 Z" fill="url(#sunGold)" />
  <path d="M51.8 51.8 L47.5 45.5 L51.5 47.5 Z" fill="url(#sunGold)" />
  <path d="M12.2 51.8 L16.5 45.5 L12.5 47.5 Z" fill="url(#sunGold)" />
  <path d="M12.2 12.2 L12.5 16.5 L16.5 12.5 Z" fill="url(#sunGold)" />

  <!-- Secondary Intermediate Rays -->
  <circle cx="43" cy="14" r="1.5" fill="#FDE68A" />
  <circle cx="50" cy="21" r="1.5" fill="#FDE68A" />
  <circle cx="50" cy="43" r="1.5" fill="#FDE68A" />
  <circle cx="43" cy="50" r="1.5" fill="#FDE68A" />
  <circle cx="21" cy="50" r="1.5" fill="#FDE68A" />
  <circle cx="14" cy="43" r="1.5" fill="#FDE68A" />
  <circle cx="14" cy="21" r="1.5" fill="#FDE68A" />
  <circle cx="21" cy="14" r="1.5" fill="#FDE68A" />

  <!-- Central Celestial Chakra Wheel -->
  <circle cx="32" cy="32" r="15" fill="#2E1065" stroke="url(#sunGold)" stroke-width="1.8" />
  
  <!-- Inner 8-Pointed Star of Destiny (Bhavishya) -->
  <polygon points="32,20 35.5,28.5 44,32 35.5,35.5 32,44 28.5,35.5 20,32 28.5,28.5" fill="url(#sunGold)" filter="url(#sunFilter)" />
  
  <!-- Sparkling Core Gem -->
  <circle cx="32" cy="32" r="4.5" fill="#FFFBEB" />
  <circle cx="32" cy="32" r="2.5" fill="#D97706" />
</svg>
