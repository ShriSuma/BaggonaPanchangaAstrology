<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Sacred Gold & Emerald Gradients -->
    <linearGradient id="waGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="waEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cardParchmentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <radialGradient id="waGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aura Glow -->
  <circle cx="24" cy="24" r="22" fill="url(#waGlow)" />

  <!-- Four Major Radiant Sparkle Rays -->
  <line x1="24" y1="3" x2="24" y2="45" stroke="#FEF3C7" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <line x1="3" y1="24" x2="45" y2="24" stroke="#FEF3C7" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

  <!-- Chat / Share Speech Bubble with Emerald Body & Gold Border -->
  <path d="M 24 9 C 13.5 9 5 16.5 5 25.5 C 5 28.8 6.2 31.8 8.2 34.3 L 6.5 41 L 13.6 39.2 C 16.6 41 20.2 42 24 42 C 34.5 42 43 34.5 43 25.5 C 43 16.5 34.5 9 24 9 Z"
        fill="url(#waEmeraldGrad)"
        stroke="url(#waGoldGrad)"
        stroke-width="1.8"
        stroke-linejoin="round"
        filter="drop-shadow(0 2px 6px rgba(0,0,0,0.5))" />

  <!-- Inner Sacred Blessing Card / Envelope (White/Gold Parchment) -->
  <rect x="13" y="16" width="22" height="15" rx="3" fill="url(#cardParchmentGrad)" stroke="#F59E0B" stroke-width="1.2" />
  
  <!-- Envelope Flap / Fold Lines -->
  <polyline points="13,16 24,24 35,16" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Divine Om / Sacred Golden Seal in Center -->
  <circle cx="24" cy="24" r="3.2" fill="#B45309" stroke="#FDE68A" stroke-width="0.8" />
  <circle cx="24" cy="24" r="1.5" fill="#FFFBEB" />

  <!-- WhatsApp Phone / Chat Handset Accent (Bottom Right of Bubble) -->
  <path d="M 29 27.5 C 29.5 28.5 31 30 32 30.5 C 32.5 30.8 33 30.6 33.3 30.2 C 33.6 29.8 34.2 29 34.5 28.5 C 34.8 28.1 34.6 27.8 34.2 27.5 L 32.5 26.5 C 32.2 26.3 31.8 26.4 31.6 26.7 C 31.2 27.2 30.8 27.4 30.5 27.2 C 30.1 27 29.5 26.4 29 25.9 C 28.5 25.4 28.1 24.8 28.3 24.5 C 28.5 24.2 28.8 23.9 29.2 23.5 C 29.5 23.2 29.4 22.8 29.2 22.5 L 28.2 20.8 C 27.9 20.4 27.6 20.2 27.2 20.5 C 26.7 20.8 25.9 21.4 25.5 21.7 C 25.1 22 25.3 22.6 25.5 23 C 26 24 27.5 26.5 29 27.5 Z"
        fill="#FFFFFF"
        opacity="0.9" />

  <!-- Top Right Sparkle Star -->
  <circle cx="38" cy="11" r="1.5" fill="#FEF08A" />
  <line x1="38" y1="7" x2="38" y2="15" stroke="#FFFFFF" stroke-width="1" />
  <line x1="34" y1="11" x2="42" y2="11" stroke="#FFFFFF" stroke-width="1" />

  <!-- Bottom Left Sparkle Star -->
  <circle cx="10" cy="38" r="1.2" fill="#FEF08A" />
  <line x1="10" y1="35" x2="10" y2="41" stroke="#FEF08A" stroke-width="0.8" />
  <line x1="7" y1="38" x2="13" y2="38" stroke="#FEF08A" stroke-width="0.8" />
</svg>
