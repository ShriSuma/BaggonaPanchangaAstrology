<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="poojaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#F97316"/>
      <stop offset="80%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <radialGradient id="glowPooja" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aura Glow behind Pooja Thali & Kalasha -->
  <circle cx="24" cy="24" r="22" fill="url(#glowPooja)" />

  <!-- Outer Pooja Thali Rim (Circular Tray) -->
  <ellipse cx="24" cy="38" rx="19" ry="6" fill="#78350F" stroke="url(#poojaGold)" stroke-width="1.8" />
  <ellipse cx="24" cy="37" rx="16" ry="4.5" fill="#451A03" />

  <!-- Sacred Kalasha (Pot) -->
  <path d="M17 38 C 16 33, 17 26, 21 24 L 27 24 C 31 26, 32 33, 31 38 Z" fill="url(#poojaGold)" stroke="#FEF08A" stroke-width="1.2" />
  <!-- Kalasha Neck & Rim -->
  <path d="M19 24 C 19 22, 29 22, 29 24" fill="none" stroke="#FEF08A" stroke-width="1.5" />
  <ellipse cx="24" cy="23.5" rx="5.5" ry="1.8" fill="url(#poojaGold)" stroke="#FEF08A" stroke-width="1" />

  <!-- Sacred Mango Leaves (Pooja Amra Pallava) -->
  <path d="M19 23 C 14 20, 13 14, 17 12 C 19 16, 20 20, 20 23 Z" fill="#10B981" stroke="#34D399" stroke-width="0.8" />
  <path d="M29 23 C 34 20, 35 14, 31 12 C 29 16, 28 20, 28 23 Z" fill="#10B981" stroke="#34D399" stroke-width="0.8" />

  <!-- Sacred Coconut (Shriphala) -->
  <ellipse cx="24" cy="18" rx="4.5" ry="5.5" fill="#92400E" stroke="url(#poojaGold)" stroke-width="1" />

  <!-- Divine Deepa Flame (Aarti Jyoti) on Top -->
  <path d="M24 4 C 20 10, 20.5 13, 24 15 C 27.5 13, 28 10, 24 4 Z" fill="url(#flameGrad)" />
  <!-- Inner Flame Core -->
  <path d="M24 7 C 22.2 10.5, 22.5 12, 24 13.5 C 25.5 12, 25.8 10.5, 24 7 Z" fill="#FFFFFF" />

  <!-- Sacred Tilak / Kumkum dots on Kalasha -->
  <circle cx="24" cy="31" r="1.6" fill="#EF4444" />
  <circle cx="21" cy="32" r="1.1" fill="#FBBF24" />
  <circle cx="27" cy="32" r="1.1" fill="#FBBF24" />

  <!-- Little Akshata / Flower offerings on Thali -->
  <circle cx="10" cy="37" r="1.3" fill="#FBBF24" />
  <circle cx="13" cy="38" r="1.4" fill="#EF4444" />
  <circle cx="35" cy="38" r="1.4" fill="#EF4444" />
  <circle cx="38" cy="37" r="1.3" fill="#FBBF24" />
</svg>
