<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <radialGradient id="sanctumGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Halo -->
  <circle cx="32" cy="32" r="30" fill="url(#sanctumGlow)" opacity="0.4" />
  
  <!-- Outer Gold Rim -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Temple Kalasha / Shikhara Pinnacle -->
  <path d="M32 6 L35 12 L29 12 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="32" cy="5" r="2" fill="#FEF08A" />

  <!-- Temple Gopuram / Tiered Tower -->
  <path d="M26 13 L38 13 L36 18 L28 18 Z" fill="url(#goldGrad)" />
  <path d="M23 19 L41 19 L39 25 L25 25 Z" fill="url(#goldGrad)" />
  <path d="M20 26 L44 26 L42 32 L22 32 Z" fill="url(#goldGrad)" />

  <!-- Temple Mandapa & Sanctum Pillars -->
  <rect x="18" y="33" width="28" height="3" rx="1.5" fill="url(#goldGrad)" />
  <rect x="20" y="36" width="3" height="15" rx="1.5" fill="url(#goldGrad)" />
  <rect x="28" y="36" width="2.5" height="15" rx="1.2" fill="url(#goldGrad)" />
  <rect x="33.5" y="36" width="2.5" height="15" rx="1.2" fill="url(#goldGrad)" />
  <rect x="41" y="36" width="3" height="15" rx="1.5" fill="url(#goldGrad)" />

  <!-- Inner Sanctum Glow & Sacred Shivalinga / Diya -->
  <ellipse cx="32" cy="46" rx="4" ry="5" fill="#FEF3C7" opacity="0.9" filter="url(#glow)" />
  <!-- Sacred Flame / Deepa Jyoti -->
  <path d="M32 39 C34 42, 34 44, 32 46 C30 44, 30 42, 32 39 Z" fill="#EF4444" />
  <circle cx="32" cy="43" r="1.5" fill="#FDE047" />

  <!-- Base Plinth -->
  <rect x="15" y="51" width="34" height="4" rx="2" fill="url(#goldGrad)" />
  <rect x="13" y="55" width="38" height="3" rx="1.5" fill="url(#goldGrad)" opacity="0.9" />
</svg>
